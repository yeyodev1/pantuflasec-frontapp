<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Ícono y OG desde Cloudinary: no hay imágenes locales en el repo. -->
    <link rel="icon" type="image/png" sizes="64x64" href="https://res.cloudinary.com/afwyrt75/image/upload/c_fill,w_64,h_64,r_max/f_png/pantuflasec/marca/kdiwg79agtwcurg3136v.jpg" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://res.cloudinary.com/afwyrt75/image/upload/c_fill,w_180,h_180/f_png/pantuflasec/marca/kdiwg79agtwcurg3136v.jpg" />

    <title>Pantuflas Ecuador</title>
    <meta name="description" content="Pantuflas, peluches, tazas, pijamas y arreglos con tus personajes favoritos. Tiendas en La Garzota y La Joya, envíos a todo el Ecuador." />
    <meta name="theme-color" content="#ffcc00" />

    <!-- Open Graph / social (WhatsApp es el canal principal de compartir) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="Pantuflas Ecuador" />
    <meta property="og:title" content="Pantuflas Ecuador — el regalo perfecto está aquí" />
    <meta property="og:description" content="Pantuflas, peluches, tazas, pijamas y arreglos con tus personajes favoritos. Envíos a todo el Ecuador." />
    <meta property="og:url" content="https://pantuflas.ec" />
    <meta property="og:image" content="https://res.cloudinary.com/afwyrt75/image/upload/c_pad,w_1200,h_630,b_rgb:ffcc00/f_jpg,q_auto/pantuflasec/marca/kdiwg79agtwcurg3136v.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes: siempre con <link>, nunca @import dentro del SCSS inyectado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Cajita de Pagos de PayPhone: se pinta en /checkout con PPaymentButtonBox -->
    <link
      rel="stylesheet"
      href="https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.css"
    />
    <script
      type="module"
      src="https://cdn.payphonetodoesposible.com/box/v2.0/payphone-payment-box.js"
    ></script>

    <!-- Font Awesome Free por CDN; iconos como <i class="fa-solid fa-…"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
